<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      viewport-fit=cover
    "
  />

  <meta
    name="theme-color"
    content="#0b1020"
  />

  <title>
    Календарь 2×2
  </title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  />

  <link
    rel="stylesheet"
    href="styles.css"
  />

</head>

<body>

  <main class="app">

    <header class="topbar">

      <div>

        <h1 class="title">
          Календарь
        </h1>

        <p class="subtitle">
          График 2 через 2
        </p>

      </div>

      <button
        id="todayBtn"
        class="today-btn"
      >
        Сегодня
      </button>

    </header>

    <section class="controls">

      <div class="month-nav">

        <button
          id="prevMonth"
          class="nav-btn"
        >
          ←
        </button>

        <div
          id="monthLabel"
          class="month-label"
        ></div>

        <button
          id="nextMonth"
          class="nav-btn"
        >
          →
        </button>

      </div>

      <div class="settings">

        <div class="setting-group">

          <label for="startDate">
            Стартовая дата
          </label>

          <input
            type="date"
            id="startDate"
          />

        </div>

        <div class="setting-group">

          <label for="startType">
            Тип дня
          </label>

          <select id="startType">

            <option value="work">
              Работа
            </option>

            <option value="off">
              Выходной
            </option>

          </select>

        </div>

      </div>

    </section>

    <section class="stats">

      <div class="stat-card">

        <span class="stat-label">
          Рабочих
        </span>

        <span
          id="workCount"
          class="stat-value"
        >
          0
        </span>

      </div>

      <div class="stat-card">

        <span class="stat-label">
          Выходных
        </span>

        <span
          id="offCount"
          class="stat-value"
        >
          0
        </span>

      </div>

    </section>

    <section class="calendar-wrapper">

      <div class="weekdays">

        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>

      </div>

      <div
        id="calendar"
        class="calendar"
      ></div>

    </section>

  </main>

  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
